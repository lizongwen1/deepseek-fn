name: Build Image & FPK

# 手动触发，或打 v* 标签时自动构建并发布
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (multi-arch amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek-harness-fnos:latest
            ghcr.io/${{ github.repository_owner }}/deepseek-harness-fnos:${{ github.ref_name }}

      - name: Replace image placeholder in compose (pin to exact version tag, not :latest)
        run: |
          sed -i "s#__GHCR_IMAGE__#ghcr.io/${{ github.repository_owner }}/deepseek-harness-fnos:${{ github.ref_name }}#g" \
            app/docker/docker-compose.yaml

      - name: Download fnpack
        run: |
          curl -#kL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack

      - name: Build FPK
        run: |
          chmod +x cmd/main cmd/install_init cmd/install_callback \
            cmd/uninstall_init cmd/uninstall_callback \
            cmd/upgrade_init cmd/upgrade_callback \
            cmd/config_init cmd/config_callback
          ./fnpack build --directory .

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-fpk
          path: deepseek-harness.fpk
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness.fpk
